name: Build Android APK (云端全自动打包)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击一键打包

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码 (Checkout code)
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 环境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. 安装项目依赖 (Install dependencies)
        run: npm ci

      - name: 4. 构建前端产物 (Build Web App)
        run: npm run build

      - name: 5. 配置 Java 17 环境 (Setup Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. 配置 Android SDK 构建环境 (Setup Android SDK)
        uses: android-actions/setup-android@v3

      - name: 7. 同步 Capacitor 资源到 Android (Capacitor Sync)
        run: npx cap sync android

      - name: 8. 赋予 Gradle 包装器执行权限 (Chmod gradlew)
        run: chmod +x ./android/gradlew

      - name: 9. 执行 Gradle 构建 Debug APK (Assemble Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 10. 上传 APK 产物供一键下载 (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tianzige-copybook-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
