name: Build Android APK (云端全自动打包)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码 (Checkout code)
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 环境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. 安装项目依赖 (Install dependencies)
        run: npm ci

      - name: 4. 构建前端产物 (Build Web App)
        run: npm run build

      - name: 5. 配置 Java 21 环境 (Setup Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 6. 安装 Android 35 平台并接受协议 (Setup Android 35 SDK)
        run: |
          yes | sdkmanager --licenses || true
          echo "y" | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: 7. 配置 Gradle 自动化构建环境 (Setup Gradle)
        uses: gradle/actions/setup-gradle@v4

      - name: 8. 同步 Capacitor 资源到 Android (Capacitor Sync)
        run: npx cap sync android

      - name: 9. 赋予 Gradle 包装器执行权限 (Chmod gradlew)
        run: chmod +x ./android/gradlew

      - name: 10. 执行 Gradle 构建 Debug APK (Assemble Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 11. 整理并命名 APK 安装包 (Prepare APK for Release)
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/*.apk dist-apk/meirilianzi-app-debug.apk

      - name: 12. 发布到 GitHub Releases Assets (永久有效、手机直链下载)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "每日练字 v1.0.${{ github.run_number }}"
          body: |
            ### 📱 每日练字 - Android APK 自动打包完成

            - **应用名称**：每日练字
            - **包名**：`com.tianzige.copybook`
            - **版本**：`v1.0.${{ github.run_number }}`
            - **构建提交**：`${{ github.sha }}`

            ---
            #### 📥 下载安装方法：
            在下方 **Assets** 列表中，直接点击 **`meirilianzi-app-debug.apk`** 即可直接下载安装包到手机，无需解压，直接安装，永久有效不限速！
          draft: false
          prerelease: false
          files: dist-apk/meirilianzi-app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 13. 保留 Actions Artifact 备份 (Backup Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: meirilianzi-android-debug-apk
          path: dist-apk/*.apk
          retention-days: 7
