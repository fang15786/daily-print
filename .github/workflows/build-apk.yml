name: Build Android APK (云端全自动打包)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码 (Checkout code)
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 环境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. 安装项目依赖 (Install dependencies)
        run: npm ci

      - name: 4. 构建前端产物 (Build Web App)
        run: npm run build

      - name: 5. 配置 Java 21 环境 (Setup Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 6. 安装 Android 35 平台并接受协议 (Setup Android 35 SDK)
        run: |
          yes | sdkmanager --licenses || true
          echo "y" | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: 7. 配置 Gradle 自动化构建环境 (Setup Gradle)
        uses: gradle/actions/setup-gradle@v4

      - name: 8. 同步 Capacitor 资源到 Android (Capacitor Sync)
        run: npx cap sync android

      - name: 9. 赋予 Gradle 包装器执行权限 (Chmod gradlew)
        run: chmod +x ./android/gradlew

      - name: 10. 执行 Gradle 构建 Debug APK (Assemble Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 11. 上传 APK 产物供一键下载 (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tianzige-copybook-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
